services:
  - type: web
    name: animezone
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: WEBHOOK_URL
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: USE_WEBHOOK
        value: "true"
