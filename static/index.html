<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AnimeZone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <!-- Splash -->
    <div id="splash">
        <div class="splash-content">
            <div class="splash-logo">🎌</div>
            <div class="splash-title">ANIMEZONE</div>
            <div class="splash-tagline">Your Anime Universe</div>
            <div class="splash-loader">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>
    </div>

    <!-- App -->
    <div id="app" style="display:none;">
        <main id="page-container"></main>

        <nav id="bottom-nav">
            <div class="nav-item active" data-page="home">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg>
                <span>Home</span>
            </div>
            <div class="nav-item" data-page="search">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
                <span>Search</span>
            </div>
            <div class="nav-item" data-page="saved">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" stroke-linejoin="round"/></svg>
                <span>Saved</span>
            </div>
            <div class="nav-item" data-page="profile">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" stroke-linecap="round"/></svg>
                <span>Me</span>
            </div>
        </nav>
    </div>

    <div id="toast-container"></div>

    <script src="/js/utils/helpers.js"></script>
    <script src="/js/utils/telegram.js"></script>
    <script src="/js/utils/haptic.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components/skeleton.js"></script>
    <script src="/js/components/card.js"></script>
    <script src="/js/components/banner.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/nav.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/filter.js"></script>
    <script src="/js/pages/home.js"></script>
    <script src="/js/pages/category.js"></script>
    <script src="/js/pages/detail.js"></script>
    <script src="/js/pages/search.js"></script>
    <script src="/js/pages/saved.js"></script>
    <script src="/js/pages/profile.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
